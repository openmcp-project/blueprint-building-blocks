---
########################################################################################################################
###! /!\ this file is only used in github pipeline to template a valid and NOT empty helm manifest! #####
#########################################################################################################
secretBindings:
  - name: "my-aws-secret-binding"
    projectNamespace: "garden-mcp-blueprints"
    kubernetesCrossplaneProviderConfigRefName: "kubernetesCrossplaneProviderConfigRefName"
    secretBindingName: "my-aws-secret-binding"
    cloudProfile: "aws"    
    labels:
      additional: "labels"
    quotas:
      - apiVersion: "apiVersion"
        kind: "kind"
        name: "name"
        namespace: "namespace"
        resourceVersion: "resourceVersion"
        uid: "uid"
    secretRef:
      name: my-aws-secret
      namespace: garden-mcp-blueprints
  - name: "my-gcp-secret-binding"
    projectNamespace: "garden-mcp-blueprints"
    kubernetesCrossplaneProviderConfigRefName: "kubernetesCrossplaneProviderConfigRefName"
    secretBindingName: "my-gcp-secret-binding"
    cloudProfile: "gcp"    
    secretRef:
      name: my-gcp-secret
      namespace: garden-mcp-blueprints
#########################################################################################################
credentialsBindings:
  - name: "my-aws-credentials-binding"
    projectNamespace: "garden-mcp-blueprints"
    kubernetesCrossplaneProviderConfigRefName: "kubernetesCrossplaneProviderConfigRefName"
    credentialsBindingName: "my-aws-credentials-binding"
    cloudProfile: "aws"
    labels:
      additional: "labels"
    credentialsRef:
      apiVersion: "v1"
      kind: "Secret"
      name: "my-aws-secret"
      namespace: "garden-mcp-blueprints"
    quotas:
      - apiVersion: "core.gardener.cloud/v1beta1"
        kind: "Quota"
        name: "my-quota"
        namespace: "garden-mcp-blueprints"
  - name: "my-gcp-credentials-binding"
    projectNamespace: "garden-mcp-blueprints"
    kubernetesCrossplaneProviderConfigRefName: "kubernetesCrossplaneProviderConfigRefName"
    credentialsBindingName: "my-gcp-credentials-binding"
    cloudProfile: "gcp"
    credentialsRef:
      apiVersion: "v1"
      kind: "Secret"
      name: "my-gcp-secret"
      namespace: "garden-mcp-blueprints"
#########################################################################################################
