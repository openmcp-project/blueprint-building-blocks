---
########################################################################################################################
###! /!\ this file is only used in github pipeline to template a valid and NOT empty helm manifest! #####
########################################################################################################################
roles:
- name: "dev-us-ekscluster"
  labels:
    crossplane.io/composite: dev-us-ekscluster
    crossplane.io/claim-namespace: dev-us
  annotations:
    crossplane.io/composition-resource-name: role
  ownerReferences:
    - apiVersion: api.example/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XEKSCluster
      name: dev-us-ekscluster
      uid: ""    
  spec:
    deletionPolicy: ""
    forProvider:
      assumeRolePolicy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "eks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
    providerConfigRef:
      name: dev-us-aws
    publishConnectionDetailsTo: {}
    writeConnectionSecretToRef: {}  
rolePolicyAttachments:
- name: "dev-us-ekscluster"
  labels:
    crossplane.io/composite: dev-us-ekscluster
    crossplane.io/claim-namespace: dev-us
  annotations:
    crossplane.io/composition-resource-name: rolePolicyAttachment
  ownerReferences:
    - apiVersion: api.example/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: XEKSCluster
      name: dev-us-ekscluster
      uid: ""
  spec:
    deletionPolicy: ""
    forProvider:
      policyArn: arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      roleSelector:
        matchControllerRef: true
    providerConfigRef:
      name: dev-us-aws
    publishConnectionDetailsTo: {}
    writeConnectionSecretToRef: {}  
policies:
- name: user-policy
  labels:
    testing.upbound.io/example-name: user
  spec:
    providerConfigRef:
      name: provider-config-ref
    forProvider:
      policy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
                "Sid": "VisualEditor0",
                "Effect": "Allow",
                "Action": "elastic-inference:Connect",
                "Resource": "*"
            }
          ]
        }
users:
- name: sample-user-rfc1123subdomain-1
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/accesskey
  labels:
    testing.upbound.io/example-name: accesskey
  spec:
    providerConfigRef:
      name: provider-config-ref
    forProvider: {}
userPolicyAttachments:
- name: example
  spec:
    providerConfigRef:
      name: provider-config-ref
    forProvider:      
      policyArnSelector:
        matchLabels:
          testing.upbound.io/example-name: user
      userSelector:
        matchLabels:
          testing.upbound.io/example-name: user
accessKeys:
- name: sample-access-key-rfc1123subdomain
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/accesskey
  labels:
    testing.upbound.io/example-name: user
  spec:
    providerConfigRef:
      name: provider-config-ref
    forProvider:
      userSelector:
        matchLabels:
          testing.upbound.io/example-name: accesskey
    writeConnectionSecretToRef:
      name: sample-access-key-secret
      namespace: upbound-system
- name: sample-access-key
  labels:
    testing.upbound.io/example-name: user
  spec:
    providerConfigRef:
      name: provider-config-ref
    forProvider:
      userSelector:
        matchLabels:
          testing.upbound.io/example-name: user
    writeConnectionSecretToRef:
      name: sample-access-key-secret
      namespace: upbound-system
########################################################################################################################
groups:
- name: dev-group
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider: {}
groupMemberships:
- name: dev-group-membership
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      groupRef:
        name: dev-group
      name: dev-group-membership
      usersRefs:
        - name: sample-user-rfc1123subdomain-1
groupPolicyAttachments:
- name: dev-group-policy-attachment
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      groupRef:
        name: dev-group
      policyArn: arn:aws:iam::aws:policy/ReadOnlyAccess
instanceProfiles:
- name: dev-instance-profile
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      roleRefs:
        - name: dev-us-ekscluster
rolePolicies:
- name: dev-role-policy
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      policy: |
        {
          "Version": "2012-10-17",
          "Statement": [{"Effect": "Allow", "Action": "s3:GetObject", "Resource": "*"}]
        }
      roleRef:
        name: dev-us-ekscluster
openIDConnectProviders:
- name: dev-oidc-provider
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      clientIdList:
        - sts.amazonaws.com
      thumbprintList:
        - 9e99a48a9960b14926bb7f3b02e22da2b0ab7280
      url: https://oidc.eks.us-east-1.amazonaws.com/id/EXAMPLE
samlProviders:
- name: dev-saml-provider
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      samlMetadataDocument: |
        <EntityDescriptor xmlns="urn:oasis:names:tc:SAML:2.0:metadata" entityID="https://example.com/saml">
        </EntityDescriptor>
serviceLinkedRoles:
- name: dev-service-linked-role
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      awsServiceName: elasticloadbalancing.amazonaws.com
userGroupMemberships:
- name: dev-user-group-membership
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      groupRefs:
        - name: dev-group
      userRef:
        name: sample-user-rfc1123subdomain-1
accountPasswordPolicies:
- name: dev-password-policy
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      minimumPasswordLength: 14
      requireLowercaseCharacters: true
      requireNumbers: true
      requireSymbols: true
      requireUppercaseCharacters: true
accountAliases:
- name: dev-account-alias
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      accountAlias: my-dev-aws-account
userLoginProfiles:
- name: dev-user-login-profile
  spec:
    providerConfigRef:
      name: dev-aws
    forProvider:
      pgpKey: keybase:some_user_on_keybase
      userRef:
        name: sample-user-rfc1123subdomain-1
    writeConnectionSecretToRef:
      name: dev-user-login-profile-secret
      namespace: upbound-system
########################################################################################################################
