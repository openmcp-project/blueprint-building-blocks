# The Chart.yaml file is required for a chart. See all avaiable fields: https://helm.sh/docs/topics/charts/#the-chartyaml-file
apiVersion: v2
name: crossplane-provider-aws-rds
description: A Helm Chart to template AWS RDS (Relational Database Service) manifests for its crossplane provider.
# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application
# A URL to an SVG or PNG image to be used as an icon
icon: "https://avatars.githubusercontent.com/u/45158470?s=48&v=4"
# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.0.13
# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "2.6.3"
# The URL of this projects home page (optional)
home: "https://github.com/openmcp-project/blueprints"
# A list of URLs to source code for this project (optional)
sources:
  # Source repository for the Crossplane AWS provider (upjet-based)
  - https://github.com/upbound/provider-aws
  # Upbound Marketplace: provider-aws-rds package page
  - https://marketplace.upbound.io/providers/upbound/provider-aws-rds/
  # CRD: rds.aws.upbound.io/v1beta3 Instance
  - https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/Instance/v1beta3
  # CRD: rds.aws.upbound.io/v1beta2 Cluster (Aurora)
  - https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/Cluster/v1beta2
  # CRD: rds.aws.upbound.io/v1beta1 ClusterInstance
  - https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/ClusterInstance/v1beta1
  # CRD: rds.aws.upbound.io/v1beta1 SubnetGroup
  - https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/SubnetGroup/v1beta1
  # CRD: rds.aws.upbound.io/v1beta1 ParameterGroup
  - https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/ParameterGroup/v1beta1
  # CRD: rds.aws.upbound.io/v1beta1 GlobalCluster
  - https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/GlobalCluster/v1beta1
  # CRD: rds.aws.upbound.io/v1beta1 Proxy
  - https://marketplace.upbound.io/providers/upbound/provider-aws-rds/latest/resources/rds.aws.upbound.io/Proxy/v1beta1
# Whether this chart is deprecated (optional, boolean)
deprecated: false
