{{- range $item := .Values.certBasedOIDCLogins }}
  {{- if and ($item) (ne $item.name "") }}
---
apiVersion: oidc.btp.sap.crossplane.io/v1alpha1
kind: CertBasedOIDCLogin
metadata:
  name: {{required "A valid value is required! (.Values.certBasedOIDCLogins[].name)" $item.name | lower }}
  labels:
    openmcp.cloud/blueprint-building-block: "{{ $.Chart.Name }}"
    openmcp.cloud/blueprint-building-block-version: "{{ $.Chart.Version }}"
spec:
  providerConfigRef:
    name: {{required "A valid value is required! (.Values.certBasedOIDCLogins[].btpSapCrossplaneProviderConfigRefName)" $item.btpSapCrossplaneProviderConfigRefName }}
  forProvider:
    {{- required "A valid value is required! (.Values.certBasedOIDCLogins[].forProvider)" $item.forProvider | toYaml | nindent 4 }}
  {{- if $item.writeConnectionSecretToRef}}
  writeConnectionSecretToRef:
    {{- $item.writeConnectionSecretToRef | toYaml | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
