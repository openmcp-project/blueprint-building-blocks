{{- range $item := .Values.orgRoles }}
  {{- if and ($item) (ne $item.name "") }}
---
apiVersion: cloudfoundry.crossplane.io/v1alpha1
kind: OrgRole
metadata:
  name: {{required "A valid value is required! (.Values.orgRoles[].name)" $item.name | lower }}
  labels:
    openmcp.cloud/blueprint-building-block: "{{ $.Chart.Name }}"
    openmcp.cloud/blueprint-building-block-version: "{{ $.Chart.Version }}"
spec:
  providerConfigRef:
    name: {{required "A valid value is required! (.Values.orgRoles[].cloudfoundryProviderConfigRefName)" $item.cloudfoundryProviderConfigRefName }}
  forProvider:
    {{- required "A valid value is required! (.Values.orgRoles[].forProvider)" $item.forProvider | toYaml | nindent 4 }}
  {{- end }}
{{- end }}
