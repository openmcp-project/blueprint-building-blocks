{{- range $item := .Values.clusterProviderConfig.kubernetesCrossplane}}
  {{- if and ($item) (ne $item.name "")}}
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: {{required "A valid value is required! (.Values.clusterProviderConfig.kubernetesCrossplane[].name)" $item.name | lower | quote}}
  labels:
    openmcp.cloud/blueprint-building-block: "{{ $.Chart.Name }}"
    openmcp.cloud/blueprint-building-block-version: "{{ $.Chart.Version }}"
spec:
  credentials:
    {{- required "A valid value is required! (.Values.clusterProviderConfig.kubernetesCrossplane[].credentials)" $item.credentials | toYaml | nindent 4 }} 
  {{- end }}
{{- end }}
