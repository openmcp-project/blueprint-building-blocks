{{- range $item := .Values.clusterPushSecrets}}
  {{- if and ($item) (ne $item.name "")}}
---
apiVersion: external-secrets.io/v1alpha1
kind: ClusterPushSecret
metadata:
  name: {{required "A valid value is required! (.Values.clusterPushSecrets[].name)" $item.name | lower | quote}}
  labels:
    openmcp.cloud/blueprint-building-block: "{{ $.Chart.Name }}"
    openmcp.cloud/blueprint-building-block-version: "{{ $.Chart.Version }}"
spec:
  {{- required "A valid value is required! (.Values.clusterPushSecrets[].spec)" $item.spec | toYaml | nindent 2 }}
  {{- end }}
{{- end }}
