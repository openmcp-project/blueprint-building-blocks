########################################################################################################################
###! /!\ this file is only used in github pipeline to template a valid and NOT empty helm manifest! #####
########################################################################################################################
clusterSecretStores:  
  - name: "hashicorp-vault-cluster-store"
    controller: "controller"
    provider:
      vault:
        server: "https://vault.example/"
        namespace: "ns1"
        path: "k8s-clusters"
        version: "v2"
        auth:
          appRole:
            path: "approle"
            roleId: "cf33bb15"
            secretRef:
              name: "hashicorp-vault-token"
              key: "token"
########################################################################################################################
clusterExternalSecret:
- name: "openmcp-test"
  externalSecretName: "externalSecretName"
  refreshTime: "1m"            
  namespaceSelectors:
    - matchLabels:
      cool: label
  externalSecretSpec:
    secretStoreRef:
      name: secret-store-name
      kind: SecretStore
    refreshInterval: "1h"
    target:
      name: my-secret
      creationPolicy: 'Merge'
      template:
        type: kubernetes.io/dockerconfigjson
        metadata:
          annotations: {}
          labels: {}
        data:
          config.yml: |
            endpoints:
            - https://{{ .data.user }}:{{ .data.password }}@api.exmaple.com
        templateFrom:
        - configMap:
            name: alertmanager
            items:
            - key: alertmanager.yaml
    data:
      - secretKey: secret-key-to-be-managed
        remoteRef:
          key: provider-key
          version: provider-key-version
          property: provider-key-property
    dataFrom:
    - key: provider-key
      version: provider-key-version
      property: provider-key-property
########################################################################################################################
secretStores:
- name: "hashicorp-vault"
  namespace: "default"
  provider:
    vault:
      server: "https://vault.example/"
      namespace: "ns1"
      path: "k8s-clusters"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "cf33bb15"
          secretRef:
            name: "hashicorp-vault-token"
            key: "token"
########################################################################################################################
externalSecret:
  - name: "openmcp-test"
    namespace: "default"
    refreshInterval: "15m"
    targetSecretName: "openmcp-test"
    secretStore:
      name: "hashicorp-vault"
    data:
      - secretKey: kubeconfig
        remoteRef:
          key: "j4azdf.laasds.shoot.live.k8s-hana.ondemand.com/garden-openmcp-test"
          property: kubeconfig
  - name: "garden-openmcp-test-2"
    namespace: "default"
    refreshInterval: "15m"
    targetSecretName: garden-openmcp-test-2
    secretStore:
      name: "hashicorp-vault"
    data:
      - secretKey: kubeconfig
        remoteRef:
          key: "j4azdf.laasds.shoot.live.k8s-hana.ondemand.com/garden-openmcp-test"
          property: kubeconfig
  - name: "btp-account-openmcp-test"
    namespace: "default"
    refreshInterval: "15m"
    targetSecretName: btp-account-openmcp-test
    secretStore:
      name: "hashicorp-vault-cluster-store"
      kind: "ClusterSecretStore"
    data:
      - secretKey: btp-cis-provider-credentials
        remoteRef:
          key: "j4azdf.laasds.shoot.live.k8s-hana.ondemand.com/btp-accounts-openmcp-test"
          property: btp-cis-provider-credentials
      - secretKey: btp-service-account-provider-credentials
        remoteRef:
          key: "j4azdf.laasds.shoot.live.k8s-hana.ondemand.com/btp-accounts-openmcp-test"
          property: btp-service-account-provider-credentials
########################################################################################################################
pushSecrets:
  - name: "openmcp-test"
    namespace: "default"
    spec:
      updatePolicy: Replace # Policy to overwrite existing secrets in the provider on sync
      deletionPolicy: Delete # the provider' secret will be deleted if the PushSecret is deleted
      refreshInterval: 1h # Refresh interval for which push secret will reconcile
      secretStoreRefs: # A list of secret stores to push secrets to
        - name: aws-parameterstore
          kind: SecretStore
      selector:
        secret:
          name: pokedex-credentials # Source Kubernetes secret to be pushed
        # Alternatively, you can point to a generator that produces values to be pushed
        generatorRef:
          apiVersion: external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: prod-registry-credentials
      template:
        metadata:
          annotations: { }
          labels: { }
        data:
          best-pokemon: "{{ .best-pokemon | toString | upper }} is the really best!"
        # Uses an existing template from configmap
        # Secret is fetched, merged and templated within the referenced configMap data
        # It does not update the configmap, it creates a secret with: data["alertmanager.yml"] = ...result...
        templateFrom:
          - configMap:
              name: application-config-tmpl
              items:
                - key: config.yml
      data:
        - conversionStrategy: None # Also supports the ReverseUnicode strategy
          match:
            secretKey: best-pokemon # Source Kubernetes secret key to be pushed
            remoteRef:
              remoteKey: my-first-parameter # Remote reference (where the secret 
########################################################################################################################
clusterPushSecrets:
  - name: "openmcp-cluster-push-test"
    spec:
      secretStoreRefs:
        - name: aws-parameterstore
          kind: ClusterSecretStore
      selector:
        secret:
          name: my-source-secret
      data:
        - match:
            secretKey: my-key
            remoteRef:
              remoteKey: my-remote-key
########################################################################################################################
vaultDynamicSecrets:
  - name: "openmcp-vault-dynamic-test"
    namespace: "default"
    spec:
      provider:
        server: "https://vault.example/"
        path: "database/creds/my-role"
        auth:
          tokenSecretRef:
            name: vault-token
            key: token
########################################################################################################################
ecrAuthorizationTokens:
  - name: "openmcp-ecr-token-test"
    namespace: "default"
    spec:
      region: "eu-central-1"
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
########################################################################################################################
clusterGenerators:
  - name: "openmcp-cluster-generator-test"
    spec:
      kind: Password
      generator:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        spec:
          length: 24
          digits: 5
          symbols: 5
          symbolCharacters: "-_$@"
          noUpper: false
          allowRepeat: false
########################################################################################################################
acrAccessTokens:
  - name: "openmcp-acr-token-test"
    namespace: "default"
    spec:
      registry: myregistry.azurecr.io
      auth:
        managedIdentity:
          identityId: "my-managed-identity-id"
########################################################################################################################
gcrAccessTokens:
  - name: "openmcp-gcr-token-test"
    namespace: "default"
    spec:
      projectID: "my-gcp-project"
      auth:
        workloadIdentity:
          clusterLocation: europe-west1
          clusterName: my-cluster
          clusterProjectID: my-project
          serviceAccountRef:
            name: my-sa
            namespace: default
########################################################################################################################
stsSessionTokens:
  - name: "openmcp-sts-token-test"
    namespace: "default"
    spec:
      region: "eu-central-1"
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
########################################################################################################################
githubAccessTokens:
  - name: "openmcp-github-token-test"
    namespace: "default"
    spec:
      appID: "12345"
      installID: "67890"
      auth:
        privateKey:
          secretRef:
            name: github-app-private-key
            key: private-key
########################################################################################################################
passwords:
  - name: "openmcp-password-test"
    namespace: "default"
    spec:
      length: 24
      digits: 5
      symbols: 5
      symbolCharacters: "-_$@"
      noUpper: false
      allowRepeat: false
########################################################################################################################
